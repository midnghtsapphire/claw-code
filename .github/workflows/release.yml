name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: claw
            archive_suffix: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: claw
            archive_suffix: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: claw.exe
            archive_suffix: zip

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p rusty-claude-cli

      - name: Package (tar.gz)
        if: matrix.archive_suffix == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="claw-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          tar czf "../${ARCHIVE}" ${{ matrix.binary }}
          echo "ASSET=../${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive_suffix == 'zip'
        shell: pwsh
        run: |
          $archive = "claw-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "../$archive"
          "ASSET=../$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
